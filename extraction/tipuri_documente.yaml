# Tipurile de documente pe care le recunoaște clasificarea (din CONȚINUT, nu din numele fișierului).
#
# Pentru fiecare tip:
#   descriere          : ce îi spunem LLM-ului despre tip
#   id_cerinte         : ID-urile din rules/cerinte_dosar.yaml acoperite de tip
#                        (ID-ul efectiv se alege după categoria dosarului)
#   roluri             : (opțional) când același tip acoperă documente „înainte” și „după”,
#                        rolul detectat din conținut alege ID-ul
#   indiciu_categorie  : (opțional) ce spune prezența documentului despre categoria proiectului
#                        forta: puternic = aproape sigur; slab = doar înclină balanța
#   cuvinte_cheie      : RO (cu și fără diacritice) + EN; folosite la pre-scorul determinist
#
# Testul extraction/tests/test_tipuri_documente.py verifică faptul că fiecare ID din
# cerinte_dosar.yaml e acoperit de cel puțin un tip.

tipuri:
  # ------------------------------------------------------------------ COMUN
  cerere_finantare:
    descriere: "Cerere de credit / finanțare depusă la bancă de solicitant (date firmă, suma solicitată, descrierea proiectului)"
    id_cerinte: [D-01]
    cuvinte_cheie: ["cerere de finanțare", "cerere de finantare", "cerere de credit", "solicitant", "suma solicitată", "suma solicitata", "descrierea proiectului", "loan application", "financing request", "applicant"]

  decizie_aprobare:
    descriere: "Decizia/aprobarea internă a băncii pentru credit (comitet de credit, data aprobării)"
    id_cerinte: [D-02]
    cuvinte_cheie: ["decizia de aprobare", "decizie de aprobare", "comitetul de credit", "aprobarea creditului", "aprobării creditului", "aprobarii creditului", "proces standard", "credit approval", "credit committee", "approval decision"]

  certificat_constatator:
    descriere: "Certificat constatator ONRC / extras de registrul comerțului (date de identificare firmă, CAEN)"
    id_cerinte: [D-03]
    cuvinte_cheie: ["certificat constatator", "registrul comerțului", "registrul comertului", "onrc", "obiect principal de activitate", "cod caen", "trade register", "certificate of incorporation"]

  beneficiar_real:
    descriere: "Declarație privind beneficiarul real al firmei"
    id_cerinte: [D-04]
    cuvinte_cheie: ["beneficiar real", "beneficiarul real", "beneficiari reali", "ultimate beneficial owner", "beneficial owner", "ubo"]

  contract_credit:
    descriere: "Contract de credit / term sheet: structura finanțării, părțile, suma, cota băncii"
    id_cerinte: [D-05]
    cuvinte_cheie: ["contract de credit", "contractul de credit", "term sheet", "împrumutat", "imprumutat", "împrumutător", "imprumutator", "facility agreement", "loan agreement", "borrower", "lender"]

  # ------------------------------------------------------------------ GREEN BUILDINGS
  certificat_sustenabilitate:

    indiciu_categorie: {categorie: green_buildings, forta: slab}
    cuvinte_cheie: ["breeam", "leed", "dgnb", "ogni", "edge", "rsb", "certificat de sustenabilitate", "certificare", "sustainability certificate", "certified", "rating"]

  certificat_energetic:

    roluri: {inainte: [GB-D6], dupa: [GB-D7]}
    indiciu_categorie: {categorie: green_buildings, forta: slab}
    cuvinte_cheie: ["certificat de performanță energetică", "certificat de performanta energetica", "clasa energetică", "clasa energetica", "energie primară", "energie primara", "kwh/m²", "kwh/m2", "energy performance certificate", "epc", "primary energy"]


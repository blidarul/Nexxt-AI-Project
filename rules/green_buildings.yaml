categorie: green_buildings
sursa: "RBI Sustainability Bond Framework, Aug-2025, p. 7-8"
taxonomie_ue: ["7.1", "7.2", "7.3", "7.4", "7.6", "7.7"]

# Subcategoria o alege agentul (sau extractorul) din descrierea proiectului.
subcategorii: [cladire_noua_sau_existenta, renovare, masura_individuala]

# --------------------------------------------------------------------------
# A. Cladiri (constructie, achizitie, detinere): ajunge SA TREACA O CALE
# --------------------------------------------------------------------------
cladire_noua_sau_existenta:
  tip: oricare
  cai:
    - id: GB-01
      nume: "Certificare internationala"
      sursa: "p. 7, notele 8 si 9"
      tip: lista_cu_ordine
      camp_sistem: certificare_sistem       # BREEAM / LEED / DGNB / OGNI / EDGE
      camp_nivel: certificare_nivel
      camp_stadiu: certificare_stadiu       # aplicat / pre-certificat / interim / final
      praguri_minime: {BREEAM: Excellent, LEED: Gold, DGNB: Gold, OGNI: Gold, EDGE: Basic}
      ordinea:
        BREEAM: [Pass, Good, Very Good, Excellent, Outstanding]
        LEED: [Certified, Silver, Gold, Platinum]
        DGNB: [Bronze, Silver, Gold, Platinum]
        OGNI: [Bronze, Silver, Gold, Platinum]
        EDGE: [Basic, Advanced, Zero Carbon]
      conditie_suplimentara:
        EDGE: {camp: economie_energie_edge_pct, operator: ">=", valoare: 0.30}   # nota 9
      stadiu_neconfirmat: OK_CONDITIONAT     # aplicat/pre-certificat/interim -> monitorizare (nota 8)
      daca_lipseste: NEEVALUABIL

    - id: GB-02
      nume: "Top 15% cladiri cu emisii mici la nivel national"
      sursa: "p. 7"
      tip: prag
      camp: percentila_nationala_ped        # 0.15 = top 15%
      operator: "<="
      valoare: 0.15
      daca_lipseste: NEEVALUABIL

    - id: GB-03
      nume: "Certificat energetic (EPC) minim clasa A"
      sursa: "p. 7"
      tip: lista
      camp: epc_clasa
      in_lista: [A, A+, A++, A+++]
      daca_lipseste: NEEVALUABIL

    - id: GB-04
      nume: "Energie primara cu minim 10% sub pragul NZEB national"
      sursa: "p. 7"
      tip: prag
      camp: ped_fata_de_nzeb                # ped_cladire / prag_nzeb_national
      operator: "<="
      valoare: 0.90
      daca_lipseste: NEEVALUABIL

# --------------------------------------------------------------------------
# B. Renovari: ajunge SA TREACA O CALE + conditiile de timp/cost
# --------------------------------------------------------------------------
renovare:
  tip: oricare
  cai:
    - id: GB-R1
      nume: "Reducere de minim 30% a energiei primare SAU a emisiilor fata de inainte de renovare"
      sursa: "p. 8, nota 10"
      tip: oricare
      conditii:
        - {camp: reducere_ped_pct, operator: ">=", valoare: 0.30}
        - {camp: reducere_emisii_pct, operator: ">=", valoare: 0.30}
      calcul_ajutator: "reducere_ped_pct = 1 - ped_dupa / ped_inainte (din EPC inainte si dupa)"
      daca_lipseste: NEEVALUABIL
    - id: GB-R2
      nume: "Renovare majora conform cerintelor nationale (Directiva 2010/31/UE)"
      sursa: "p. 8, nota 11"
      tip: da_nu
      camp: conform_renovare_majora
      valoare: true
      daca_lipseste: NEEVALUABIL
  conditii_obligatorii:
    - id: GB-R3
      nume: "Reducerea se atinge in maxim 3 ani de la emitere"
      sursa: "p. 8, nota 10"
      tip: prag
      camp: ani_pana_la_reducere
      operator: "<="
      valoare: 3
      daca_lipseste: OK_CONDITIONAT     # se monitorizeaza
    - id: GB-R4
      nume: "Finantarea acopera doar costurile de renovare"
      sursa: "p. 8, nota 10"
      tip: prag
      camp: pondere_suma_pentru_renovare
      operator: ">="
      valoare: 1.0
      daca_lipseste: SEMNAL

# --------------------------------------------------------------------------
# C. Masuri individuale de renovare: depinde de tipul masurii
# --------------------------------------------------------------------------
masura_individuala:
  camp_tip: tip_masura
  reguli:
    - id: GB-M1
      nume: "Statii de incarcare EV: nu in parcari independente (decat daca parcarea e in cladire)"
      sursa: "p. 8, nota 12"
      aplica_daca: {tip_masura: statie_incarcare}
      tip: da_nu
      camp: statie_in_cladire
      valoare: true
      daca_lipseste: NEEVALUABIL
    - id: GB-M2
      nume: "Pompe de caldura: agent frigorific cu GWP <= 675"
      sursa: "p. 8, nota 13"
      aplica_daca: {tip_masura: pompa_caldura}
      tip: prag
      camp: gwp_agent_frigorific
      operator: "<="
      valoare: 675
      daca_lipseste: NEEVALUABIL
    - id: GB-M3
      nume: "Pompe de caldura: sistem de management al agentului frigorific (Reg. UE 2024/573)"
      sursa: "p. 8, nota 13"
      aplica_daca: {tip_masura: pompa_caldura}
      tip: da_nu
      camp: sistem_management_agent_frigorific
      valoare: true
      daca_lipseste: NEEVALUABIL
    - id: GB-M4
      nume: "Stocare de energie integrata direct cu surse regenerabile"
      sursa: "p. 8"
      aplica_daca: {tip_masura: stocare_energie}
      tip: da_nu
      camp: integrat_cu_regenerabile
      valoare: true
      daca_lipseste: NEEVALUABIL
    - id: GB-M5
      nume: "Micro-cogenerare alimentata din surse regenerabile"
      sursa: "p. 8"
      aplica_daca: {tip_masura: micro_chp}
      tip: da_nu
      camp: alimentat_regenerabil
      valoare: true
      daca_lipseste: NEEVALUABIL
    - id: GB-M6
      nume: "Recuperatoare de caldura: nu pentru sisteme pe combustibili fosili"
      sursa: "p. 8, nota 14"
      aplica_daca: {tip_masura: recuperator_caldura}
      tip: excludere
      camp: deserveste_sistem_fosil
      valoare: true
      daca_lipseste: NEEVALUABIL

# --------------------------------------------------------------------------
# Excluderi pentru toata categoria
# --------------------------------------------------------------------------
excluderi:
  - id: GB-X1
    nume: "Cladiri folosite pentru extractia/fabricarea combustibililor fosili"
    sursa: "p. 7, nota 6"
    tip: excludere
    camp: chiriasi_caen
    prefixe_caen_semnal: ["0510", "0520", "0610", "0620", "0910", "1910", "1920"]
    rezultat_daca_partial: SEMNAL     # ocupare partiala = caz de judecata -> comitet
  - id: GB-X2
    nume: "Certificare refuzata sau insuficienta la final -> iesire din portofoliu"
    sursa: "p. 7, nota 8"
    tip: monitorizare
    camp: certificare_stadiu
